apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinenova-web
  labels:
    app: cinenova-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cinenova-web
  template:
    metadata:
      labels:
        app: cinenova-web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: ghcr.io/example/cinenova-web:replace-with-release-digest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: cinenova-web-secrets
            - configMapRef:
                name: cinenova-web-config
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cinenova-web
spec:
  selector:
    app: cinenova-web
  ports:
    - port: 80
      targetPort: 3000
