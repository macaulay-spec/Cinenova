services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinenova
      POSTGRES_PASSWORD: cinenova
      POSTGRES_DB: cinenova
    ports:
      - "5432:5432"
    volumes:
      - cinenova_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinenova -d cinenova"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - cinenova_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cinenova:cinenova@postgres:5432/cinenova?schema=public
      REDIS_URL: redis://redis:6379
      PROVIDER_ROUTING: mock
      GZMOVIE_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    command: ["npx", "pnpm@9.15.4", "--filter", "@cinenova/worker", "dev"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  cinenova_postgres:
  cinenova_redis:
